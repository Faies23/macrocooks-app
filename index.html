<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
/* ============ THEME TOKENS ============ */
:root{
  --maroon:#7a2e2e; --maroon-2:#9c4440; --maroon-soft:#b5736f;
  --radius:18px; --radius-sm:12px;
  --shadow:0 10px 30px rgba(0,0,0,.12);
  --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
/* WHITE THEME (default) */
body[data-theme="white"]{
  --bg:#efe7e2; --app-bg:linear-gradient(168deg,#fdfaf8 0%,#f3e7e1 100%); --surface:#ffffff; --surface-2:#f4ece9;
  --text:#2a201d; --muted:#8a7c76; --line:#ece2dd;
  --accent:#7a2e2e; --accent-2:#9c4440; --on-accent:#fff;
  --good:#3f8f5b; --bad:#c0504a; --ring-track:#eaddd8;
}
/* BLACK THEME */
body[data-theme="black"]{
  --bg:#0c0a09; --app-bg:linear-gradient(168deg,#1c1613 0%,#0e0b09 100%); --surface:#201a17; --surface-2:#2a2320;
  --text:#f4ece8; --muted:#a99b94; --line:#332a26;
  --accent:#c0625c; --accent-2:#d98a84; --on-accent:#1a1413;
  --good:#5fbe7e; --bad:#e07a72; --ring-track:#332a26;
}
/* COLOURFUL THEME */
body[data-theme="colour"]{
  --bg:linear-gradient(135deg,#ff9a9e 0%,#fecfef 45%,#a18cd1 100%);
  --app-bg:linear-gradient(160deg,#fff1f7 0%,#f3e9ff 100%);
  --surface:#ffffff; --surface-2:#fdeef6;
  --text:#3a2540; --muted:#9b7fa6; --line:#f3dcec;
  --accent:#d6336c; --accent-2:#f06595; --on-accent:#fff;
  --good:#37b24d; --bad:#e8590c; --ring-track:#f6dcea;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
 font-family:var(--font); background:var(--bg); color:var(--text);
 min-height:100vh; display:flex; align-items:flex-start; justify-content:center;
 padding:24px 12px; -webkit-font-smoothing:antialiased;
}
/* ============ PHONE FRAME ============ */
.phone{
 width:100%; max-width:430px; background:var(--app-bg); border-radius:36px;
 box-shadow:var(--shadow),0 0 0 10px rgba(0,0,0,.06); overflow:hidden;
 position:relative; height:calc(100vh - 48px); min-height:480px; max-height:1000px; display:flex; flex-direction:column;
}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 4px;font-size:13px;font-weight:600;color:var(--text);opacity:.8}
.statusbar .dots{display:flex;gap:4px;align-items:center}
.statusbar .dots span{width:6px;height:6px;border-radius:50%;background:var(--text);opacity:.5}
header#appHeader{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 12px;gap:10px}
.brand{display:flex;align-items:center;gap:9px}
.brand .logo{flex:none;vertical-align:middle}
.brand .name{font-weight:800;font-size:18px;letter-spacing:.2px}
.brand .name b{color:var(--accent)}
.hdr-actions{display:flex;gap:8px;align-items:center}
.chip-btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px}
.chip-btn:active{transform:scale(.96)}
main#screen{flex:1;overflow-y:auto;padding:4px 18px 96px}
main#screen::-webkit-scrollbar{width:0}
/* ============ NAV ============ */
nav#tabbar{position:absolute;bottom:0;left:0;right:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));}
nav#tabbar button{flex:1;background:none;border:none;color:var(--muted);font-size:10.5px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0}
nav#tabbar button .ic{font-size:19px;line-height:1}
nav#tabbar button.active{color:var(--accent)}
/* ============ COMPONENTS ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card.flush{padding:0;overflow:hidden}
h1{font-size:23px;margin:8px 0 2px;font-weight:800}
h2{font-size:17px;margin:18px 2px 8px;font-weight:800}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.row{display:flex;gap:10px}
.row>*{flex:1}
label{display:block;font-size:12.5px;font-weight:700;margin:12px 2px 5px;color:var(--text)}
input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text);font-size:14.5px;font-family:var(--font)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:none;border-radius:var(--radius-sm);background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:800;cursor:pointer;font-family:var(--font)}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:9px 12px;font-size:13px;width:auto}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.lock{color:var(--accent);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chips .ch{padding:9px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;user-select:none}
.chips .ch.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:12px} .center{text-align:center}
.b{font-weight:800}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stat .v{font-size:22px;font-weight:800}.stat .l{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.divider{height:1px;background:var(--line);margin:14px 0}
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--app-bg);padding:11px 18px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:60;white-space:nowrap;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* meal item */
.meal{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:none}
.meal .emoji{width:42px;height:42px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.meal .info{flex:1;min-width:0}
.meal .info .t{font-weight:700;font-size:14px}
.meal .info .d{font-size:11.5px;color:var(--muted)}
.tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent}
.tick.eaten{background:var(--good);border-color:var(--good);color:#fff}
.tick.skip{background:var(--bad);border-color:var(--bad);color:#fff}
.daytabs{display:flex;gap:7px;overflow-x:auto;padding:4px 0 10px}
.daytabs::-webkit-scrollbar{height:0}
.daytabs button{flex:none;padding:8px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:12.5px;font-weight:700;cursor:pointer}
.daytabs button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
/* lock overlay */
.locked{position:relative}
.locked .veil{position:absolute;inset:0;background:color-mix(in srgb,var(--surface) 78%,transparent);backdrop-filter:blur(3px);border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:18px}
/* ring */
.ring-wrap{display:flex;align-items:center;gap:16px}
.recipe-step{display:flex;gap:11px;margin-bottom:11px}
.recipe-step .n{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
/* learn cards */
.learn-card{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);margin-bottom:14px;background:var(--surface)}
.learn-thumb{height:120px;display:flex;align-items:center;justify-content:center;font-size:46px;position:relative}
.learn-thumb .play{position:absolute;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;font-size:18px;color:#222}
.learn-thumb .badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px}
.learn-body{padding:12px 14px}
/* sheet / modal */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:70;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:.25s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{background:var(--app-bg);width:100%;border-radius:24px 24px 0 0;padding:8px 18px 24px;transform:translateY(30px);transition:.28s;max-height:88%;overflow-y:auto}
.overlay.show .sheet{transform:translateY(0)}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 12px}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0}
.pay-opt{display:flex;align-items:center;gap:9px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font-size:13px;font-weight:700}
.pay-opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.pay-opt .mm{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex:none}
.benefit{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;margin:7px 0}
.benefit .ck{color:var(--good);font-weight:800}
.price-tag{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:2px 0 6px}
.price-tag .usd{font-size:30px;font-weight:800}
.price-tag .alt{font-size:14px;color:var(--muted);font-weight:700}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;margin:10px 0}
.seg button{flex:1;border:none;background:none;padding:9px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.flag{font-size:10px;padding:2px 7px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:800;letter-spacing:.4px}
.tprev{display:flex;gap:8px;margin-top:8px}
.tprev .sw{flex:1;border-radius:12px;border:2px solid var(--line);padding:10px;cursor:pointer;text-align:center;font-size:11.5px;font-weight:700}
.tprev .sw.on{border-color:var(--accent)}
.selftest{display:none;position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;z-index:90}
.wel-top{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:14px 18px 0}
.welcome-hero{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:600px;padding:8px 24px 24px;gap:6px}
.welcome-hero .big-logo{margin-bottom:6px;display:flex;justify-content:center;width:100%}
.feat{display:flex;gap:11px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;width:100%;margin-top:10px}
.feat .fi{font-size:22px}
.note{font-size:11.5px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
a.link{color:var(--accent);font-weight:700;text-decoration:none;cursor:pointer}
.ba{height:120px;border:1px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--surface-2)}
.ba img{width:100%;height:100%;object-fit:cover}
#splash{position:fixed;inset:0;z-index:9999;background:#faf2ec;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;transition:opacity .6s ease,visibility .6s;animation:splashFail 0s linear 5000ms forwards}
@keyframes splashFail{to{opacity:0;visibility:hidden;pointer-events:none}}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splashLogo{opacity:0;transform:scale(.9);animation:splashIn .9s cubic-bezier(.22,1,.36,1) .05s forwards}
.splash-name{font-weight:800;font-size:22px;color:#7a2e2e;letter-spacing:.3px;opacity:0;transform:translateY(7px);animation:splashUp .6s cubic-bezier(.22,1,.36,1) .55s forwards}
.splash-motto{display:flex;gap:10px;margin-top:1px}
.splash-motto span{font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:#9b8b84;opacity:0;transform:translateY(9px);animation:splashUp .5s cubic-bezier(.22,1,.36,1) forwards}
.splash-motto span:nth-child(1){animation-delay:.95s}
.splash-motto span:nth-child(2){animation-delay:1.2s}
.splash-motto span:nth-child(3){animation-delay:1.45s}
@keyframes splashIn{to{opacity:1;transform:scale(1)}}
@keyframes splashUp{to{opacity:1;transform:none}}
.motto{font-size:11px;letter-spacing:2.2px;text-transform:uppercase;font-weight:700;color:var(--muted);margin-top:3px}
@media (prefers-reduced-motion:reduce){#splashLogo,.splash-name,.splash-motto span{animation:none;opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- SHOP ---------- */
.shopbar{position:sticky;top:0;z-index:20;background:var(--app-bg);padding:2px 0 6px;margin:0 -2px}
.shopchips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px}
.shopchips::-webkit-scrollbar{height:0}
.goalrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 4px}
.goalcard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 11px;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--text);font:inherit}
.goalcard b{font-size:13px;font-weight:800}
.goalcard span{font-size:11px;color:var(--muted);line-height:1.35}
.goalcard i{font-size:10.5px;color:var(--muted);font-style:normal;margin-top:3px}
.goalcard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.goalcard:active{transform:scale(.99)}
.shopchips{scroll-snap-type:x proximity;overscroll-behavior-x:contain}
.shopchips .ch{flex:none;white-space:nowrap;padding:8px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font-size:12.5px;font-weight:700;cursor:pointer;scroll-snap-align:center;transition:background .13s ease,color .13s ease,border-color .13s ease,transform .08s ease}
.shopchips .ch.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.shopchips .ch:active{transform:scale(.95)}
.shopsec{scroll-margin-top:calc(var(--chipH,46px) + 4px)}
.sechead{position:sticky;top:var(--chipH,46px);z-index:15;background:var(--app-bg);font-weight:800;font-size:15px;padding:9px 0 7px;margin:0 -2px}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){ .pcard{animation:cardIn .3s ease both} }
@media (prefers-reduced-motion:reduce){ .shopchips .ch{transition:none} }
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;position:relative;display:flex;flex-direction:column}
.pcard:active{transform:scale(.99)}
.pcard .pimg{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--surface-2);display:block}
.pcard .pbody{padding:9px 10px 12px;flex:1;display:flex;flex-direction:column;gap:1px}
.pcard .pn{font-weight:700;font-size:12.5px;line-height:1.25}
.pcard .pw{font-size:10.5px;color:var(--muted)}
.pcard .pp{font-weight:800;font-size:14px;margin-top:5px}
.pcard .pwas{font-size:10.5px;color:var(--muted);text-decoration:line-through;margin-left:5px;font-weight:600}
.pcard .padd{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);border:none;font-size:21px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer}
.pcard .pout{position:absolute;top:8px;left:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;z-index:2}
.cartpill{position:sticky;bottom:12px;z-index:25;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent);color:var(--on-accent);border-radius:16px;padding:14px 16px;margin:14px 2px 0;box-shadow:0 12px 28px rgba(0,0,0,.32);cursor:pointer;font-weight:800;font-size:14px}
@keyframes cartPop{0%{transform:scale(1)}28%{transform:scale(1.05)}100%{transform:scale(1)}}
.cartpill.pop{animation:cartPop .32s ease}
.qstep{display:inline-flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:999px;padding:4px 8px}
.qstep button{width:28px;height:28px;border-radius:50%;border:none;background:var(--surface-2);color:var(--text);font-size:18px;line-height:1;cursor:pointer}
.cartrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.cartrow img{width:50px;height:50px;border-radius:12px;object-fit:cover;background:var(--surface-2);flex:none}
.pimg.pph{display:flex;align-items:center;justify-content:center;font-size:54px}
.cartrow .ctph{width:50px;height:50px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px}
@media (max-width:480px){ body{padding:0} .phone{max-width:100%;height:100vh;height:100dvh;max-height:none;min-height:0;border-radius:0;box-shadow:none} }
@media (display-mode:standalone){ body{padding:0} .phone{max-width:100%;height:100vh;height:100dvh;max-height:none;min-height:0;border-radius:0;box-shadow:none} .selftest{display:none} }

/* ============ NOIR GOLD · LUXE THEME ============ */
body[data-theme="noir"]{
  --bg:#040303;
  --app-bg:
 radial-gradient(115% 50% at 88% -6%, rgba(232,184,75,.20), transparent 55%),
 radial-gradient(120% 45% at 8% 2%, rgba(200,130,31,.15), transparent 52%),
 radial-gradient(150% 55% at 50% 112%, rgba(232,184,75,.11), transparent 60%),
 linear-gradient(180deg,#100b06 0%,#0a0705 45%,#070504 100%);
  --surface:rgba(40,32,20,.5); --surface-2:rgba(52,42,25,.6);
  --text:#f6efe2; --muted:#a59a87; --line:rgba(232,184,75,.16);
  --accent:#e8b84b; --accent-2:#c8821f; --on-accent:#2a1c06;
  --maroon-soft:#8a5a1c; --good:#6bd49a; --bad:#e0726a; --ring-track:rgba(255,255,255,.07);
 font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:#040303;
}
body[data-theme="noir"] .phone{box-shadow:0 50px 130px rgba(0,0,0,.7),inset 0 0 0 1px rgba(232,184,75,.10);}
body[data-theme="noir"] .brand .logo{filter:brightness(0) invert(1) drop-shadow(0 0 7px rgba(232,184,75,.6));opacity:.96;}
body[data-theme="noir"] .selftest{display:none;}
body[data-theme="noir"] .statusbar{color:var(--muted);}
body[data-theme="noir"] .statusbar .dots span{background:var(--muted);}
body[data-theme="noir"] h1,
body[data-theme="noir"] h2,
body[data-theme="noir"] .stat .v,
body[data-theme="noir"] .price-tag .usd,
body[data-theme="noir"] .splash-name{font-family:'Fraunces',Georgia,serif;letter-spacing:-.3px;font-weight:600;}
body[data-theme="noir"] .card,
body[data-theme="noir"] .stat{border-radius:22px;}
body[data-theme="noir"] .stat .v{background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
body[data-theme="noir"] .btn{background:linear-gradient(100deg,#f4d58a,var(--accent) 55%,var(--accent-2));color:#2a1c06;box-shadow:0 12px 30px rgba(232,184,75,.30);border:none;}
body[data-theme="noir"] .btn.ghost,
body[data-theme="noir"] .btn.sm.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line);box-shadow:none;}
body[data-theme="noir"] nav#tabbar{left:14px;right:14px;bottom:14px;border-radius:22px;background:rgba(16,11,7,.92);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.55);padding:9px 6px calc(9px + env(safe-area-inset-bottom));}
body[data-theme="noir"] nav#tabbar button{gap:4px;}
body[data-theme="noir"] nav#tabbar button .ic{width:42px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:13px;transition:.2s;}
body[data-theme="noir"] nav#tabbar button .ic svg{width:21px;height:21px;}
body[data-theme="noir"] nav#tabbar button.active{color:#f4d58a;}
body[data-theme="noir"] nav#tabbar button.active .ic{background:linear-gradient(135deg,#f4d58a,var(--accent-2));color:#2a1c06;box-shadow:0 8px 20px rgba(232,184,75,.45);}
body[data-theme="noir"] .ring-wrap svg circle:last-of-type{filter:drop-shadow(0 0 5px var(--accent));}
body[data-theme="noir"] .meal .emoji{width:50px;height:50px;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,rgba(232,184,75,.92),rgba(200,130,31,.85));box-shadow:0 6px 14px rgba(0,0,0,.35);}
body[data-theme="noir"] .tick.eaten{box-shadow:0 6px 18px rgba(232,184,75,.4);}
body[data-theme="noir"] .daytabs button.on{box-shadow:0 8px 20px rgba(232,184,75,.35);}
body[data-theme="noir"] .flag,
body[data-theme="noir"] .recipe-step .n{background:linear-gradient(135deg,#f4d58a,var(--accent-2));color:#2a1c06;}
body[data-theme="noir"] .sheet{background:rgba(16,11,7,.96);}
body[data-theme="noir"] .note{background:var(--surface);border:1px solid var(--line);}
body[data-theme="noir"] #splash{background:radial-gradient(120% 80% at 50% 0%,rgba(232,184,75,.20),transparent 60%),#0a0705;}
body[data-theme="noir"] .splash-name{color:#fff;}
body[data-theme="noir"] .splash-sub{color:#a59a87;}
body[data-theme="noir"] .splash-spin{border-color:rgba(255,255,255,.13);border-top-color:var(--accent);}
/* food-photo thumbnails (all themes) + hero featured-meal card */
.meal .emoji img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit;}
.mc-hero{position:relative;border-radius:26px;overflow:hidden;height:316px;margin:6px 0 16px;box-shadow:0 26px 54px rgba(0,0,0,.5),0 0 0 1px rgba(232,184,75,.14);cursor:pointer}
.mc-hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mc-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,5,3,.10),rgba(8,5,3,.30) 45%,rgba(8,5,3,.9))}
.mc-top{position:absolute;top:14px;left:14px;right:14px}
.mc-tag{display:inline-flex;gap:6px;background:rgba(8,5,3,.6);border:1px solid rgba(232,184,75,.22);padding:6px 12px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#f4d58a}
.mc-body{position:absolute;left:18px;right:18px;bottom:16px}
.mc-title{font-family:'Fraunces',Georgia,serif;font-size:25px;font-weight:600;color:#fff;line-height:1.05}
.mc-sub{font-size:12px;color:#e0d5bf;margin-top:4px}
.mc-chips{display:flex;gap:8px;margin:11px 0 13px;flex-wrap:wrap}
.mc-chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 11px;font-size:11px;font-weight:600;color:#f1e7d4}
.mc-chip b{color:#f4d58a}
.mc-cook{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(100deg,#f4d58a,#e8b84b 55%,#c8821f);color:#2a1c06;font-weight:700;font-size:13px;padding:11px 18px;border-radius:14px;box-shadow:0 12px 26px rgba(232,184,75,.35)}
</style>
</head>

/* ---------- NUTRITION ENGINE (Mifflin-St Jeor) ---------- */
const ACT = {sedentary:1.2, light:1.375, moderate:1.55, active:1.725, athlete:1.9};
// Does the profile carry a condition with the given strategy flag (e.g. carbControl, lowSatFat)?
function hasCondition(p,flag){ return (p&&p.conditions||[]).some(function(id){var c=CONDITIONS.find(function(x){return x.id===id;});return c&&c[flag];}); }
function computeTargets(p){
 const w=Math.max(1,+p.weight||0), h=Math.max(1,+p.height||0), a=Math.max(1,+p.age||0);
 const bmr = 10*w + 6.25*h - 5*a + (p.sex==="male"?5:-161);
 const tdee = bmr * (ACT[p.activity]||1.375);
 let cal = tdee;
 if(p.goal==="lose") cal = tdee - 500;
 else if(p.goal==="gain") cal = tdee + 350;
 cal = Math.max(1200, Math.round(cal/10)*10);
  // Diabetes / PCOS -> insulin-friendly split: more protein, more healthy fat, fewer (low-GI) carbs.
 const carbControl = hasCondition(p,"carbControl");
 const proteinPerKg = (p.goal==="gain"?2.0:1.8) + (carbControl?0.2:0);
 const protein = Math.round(proteinPerKg*w);                          // g
 const fat = Math.round((cal*(carbControl?0.35:0.27))/9);             // g
 const carbs = Math.max(0, Math.round((cal - protein*4 - fat*9)/4));  // g
 return {bmr:Math.max(0,Math.round(bmr)), tdee:Math.max(0,Math.round(tdee)), cal, protein, fat, carbs, carbControl};
}
// Higher-glycaemic / refined starches to de-prioritise for diabetes & PCOS.
function currentMonthKey(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1); }
function monthSeed(){ var d=new Date(); return d.getFullYear()*12 + d.getMonth(); }
function maybeRefreshMonthlyPlan(){
 if(state.onboardComplete && state.plan && state.targets){
 var mk=currentMonthKey();
 if(state.planMonth!==mk){ state.plan=[]; state.planMonth=mk; state.track={}; state._monthlyRefreshed=true; loadPlanFromServer(); }
  }
}

function fmt(cur,usd){
 const rate=RATE[cur]!=null?RATE[cur]:1, d=DEC[cur]!=null?DEC[cur]:2, sym=SYM[cur]!=null?SYM[cur]:"$";
 const v=(+usd||0)*rate;
 const num=v.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
 return sym+" "+num;
}
function priceLine(usd){ // always USD + TZS, plus selected currency if different
 let s = fmt("USD",usd)+" <span class='alt'>≈ "+fmt("TZS",usd)+"</span>";
 if(state.currency!=="USD"&&state.currency!=="TZS") s+=" <span class='alt'>· "+fmt(state.currency,usd)+"</span>";
 return s;
}

/* ---------- GLYCAEMIC INDEX (condition-aware) ---------- */
const LOW_GI=/oat|uji|bean|maharage|lentil|dengu|chickpea|mbaazi|cowpea|kunde|sweet potato|kiazi|millet|brown rice|sukuma|mchicha|matembele|kisamvu|majani|mlenda|green|kabichi|tofu|yogurt|mtindi|nut|almond|korosho|groundnut|karanga|cashew|avocado|parachichi|egg|yai|fish|tilapia|dagaa|mackerel|samaki|chicken|kuku|beef|nyama|goat|mbuzi/i;
function giLevel(f){ var n=((f&&f.n)||"").toLowerCase(), c=+(f&&f.c)||0;
 if(c<6) return "low";
 if(typeof HIGH_GI!=="undefined" && HIGH_GI.test(n)) return "high";
 if(/mango|embe|pineapple|nanasi|watermelon|tikiti|sugar|honey|mandazi/.test(n)) return "high";

 state.foodLog.push({ name:f.n+" ("+label+")", kcal:Math.round(f.kcal*mult), p:Math.round(f.p*mult), c:Math.round(f.c*mult), f:Math.round(f.f*mult), gi:giLevel(f), date:new Date().toISOString().slice(0,10) });

function fracStr(x){ var r=Math.round(x*4)/4,w=Math.floor(r),fr=r-w,m={0.25:"¼",0.5:"½",0.75:"¾"},fs=m[fr]||""; return (w===0)?(fs||"0"):(""+w+fs); }
function portionText(it){
 var f=FOODS.find(function(x){return x.n===it.n;}), t=(f&&f.tag)||[], s=it.serv;
 if(t.indexOf("meat")>=0) return Math.max(30,Math.round(120*s/10)*10)+" g";
 if(t.indexOf("egg")>=0){ var n=Math.max(1,Math.round(2*s)); return n+" egg"+(n>1?"s":""); }
 if(t.indexOf("fruit")>=0){ if(/nanasi|tikiti|papai/i.test(it.n)) return fracStr(s)+" cup"+(s>1.25?"s":""); var n2=Math.max(1,Math.round(s)); return n2+" "+(n2>1?"pieces":"medium"); }

 return fracStr(s)+" cup"+(s>1.25?"s":""); // carbs / legumes / dairy / vegetables / default
}

function shopProd(s){ return SHOP.find(function(p){return p.s===s;}); }
function catMeta(k){ for(var i=0;i<SHOP_CATS.length;i++){ if(SHOP_CATS[i].k===k) return SHOP_CATS[i]; } return {k:k,label:k}; }
function goalMeta(k){ for(var i=0;i<SHOP_GOALS.length;i++){ if(SHOP_GOALS[i].k===k) return SHOP_GOALS[i]; } return null; }
function shopImg(p,cls){ return '<img class="pimg'+(cls?" "+cls:"")+'" src="shop/'+p.s+'.jpg" alt="'+escapeHtml(p.n)+'" loading="lazy" onerror="this.style.visibility=\'hidden\'">'; }
function shopMoney(tzs){ return "TSh "+Number(tzs||0).toLocaleString(); }
function cartCount(){ var c=state.cart||{},n=0; for(var s in c)n+=c[s]; return n; }
function cartSubtotal(){ var c=state.cart||{},t=0; for(var s in c){ var p=shopProd(s); if(p)t+=p.tzs*c[s]; } return t; }
function refreshCartPill(){ var el=document.getElementById("cartpill"); if(!el)return; var n=cartCount(); if(!n){el.style.display="none";return;} el.style.display="flex"; el.innerHTML='<span>'+n+' item'+(n>1?"s":"")+' in your basket</span><span>'+shopMoney(cartSubtotal())+'. View basket</span>'; }
function setShopCat(k){ state._shopCat=k; render(); }
function popCart(){ var el=document.getElementById("cartpill"); if(!el||!cartCount())return; el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
function shopAdd(s){ state.cart=state.cart||{}; var p=shopProd(s); if(!p||p.out){toast("Out of stock");return;} state.cart[s]=(state.cart[s]||0)+1; try{saveState();}catch(e){} refreshCartPill(); popCart(); toast(p.n+" added to your basket"); }

function setActiveChip(k){
 var bar=document.getElementById("shopchips"); if(!bar)return;
 var chips=bar.querySelectorAll(".ch"), active=null;
 for(var i=0;i<chips.length;i++){ var on=chips[i].getAttribute("data-cat")===k; chips[i].classList.toggle("on",on); if(on)active=chips[i]; }
 if(active) active.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
}
function shopJump(k){
 var el=document.getElementById("cat-"+k), sc=document.getElementById("screen"); if(!el)return;
 window._shopNavLock=true; setActiveChip(k);
 var smooth=!window.matchMedia||window.matchMedia("(prefers-reduced-motion:no-preference)").matches;
 el.scrollIntoView({behavior:smooth?"smooth":"auto",block:"start"});
 var release=function(){ window._shopNavLock=false; };
 if(sc && "onscrollend" in sc){ sc.addEventListener("scrollend",release,{once:true}); setTimeout(release,1000); }
 else { clearTimeout(window._shopNavT); window._shopNavT=setTimeout(release,650); }
}
function initShopNav(){
 var sc=document.getElementById("screen"), list=document.getElementById("shoplist"); if(!sc||!list)return;
 if(window._shopObs){ try{window._shopObs.disconnect();}catch(e){} }
 var bar=document.querySelector(".shopbar"), chipH=(bar?bar.offsetHeight:46);
 list.style.setProperty("--chipH", chipH+"px");
 var secs=[].slice.call(list.querySelectorAll(".shopsec")); if(!secs.length)return;
 var vis={}, last=null;
 var io=new IntersectionObserver(function(entries){
 for(var i=0;i<entries.length;i++){ vis[entries[i].target.id]=entries[i].isIntersecting; }
 if(window._shopNavLock) return;
 for(var j=0;j<secs.length;j++){ if(vis[secs[j].id]){ var k=secs[j].id.slice(4); if(k!==last){ last=k; setActiveChip(k); } break; } }
  }, { root:sc, rootMargin:"-"+(chipH+2)+"px 0px -68% 0px", threshold:0 });
 secs.forEach(function(s){ io.observe(s); });
 window._shopObs=io;
 if(secs[0]){ last=secs[0].id.slice(4); setActiveChip(last); }
}

function renderProductSheet(){ var p=shopProd(state._pd); if(!p)return; var q=state._pdQty||1;
 var h='<div class="grab"></div>'

   +(state.currency&&state.currency!=="TZS"?'<div class="small muted">≈ '+fmt(state.currency,p.tzs/(RATE.TZS||2600))+'</div>':'')
   +'<div class="small" style="margin:11px 0 6px">'+escapeHtml(p.desc)+'</div>'
   +'<div class="card" style="background:var(--surface-2);padding:12px;margin-top:2px"><div class="small b">💚 Health benefits</div><div class="small muted" style="margin-top:3px">'+escapeHtml(p.ben)+'</div></div>';
 if(p.out){ h+='<button class="btn" style="margin-top:12px;opacity:.55" disabled>Sold out</button>'; }
 else { h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-top:13px"><span class="small muted">Quantity</span><div class="qstep"><button onclick="setPdQty(-1)">−</button><b>'+q+'</b><button onclick="setPdQty(1)">+</button></div></div>'
    +'<button class="btn" style="margin-top:11px" onclick="addPd()">Add '+q+' · '+shopMoney(p.tzs*q)+'</button>'; }
 h+='<button class="btn ghost" style="margin-top:8px" onclick="closePay()">Close</button>';
  $("sheet").innerHTML=h;

function weightChart(){
 let pts=state.weightLog.slice().map(function(q){return {d:(q&&q.d),kg:(isFinite(Number(q&&q.kg))?Number(q.kg):(+state.profile.weight||0))};});
 if(pts.length===0) pts=[{d:0,kg:(+state.profile.weight||0)}];
  // build projection toward goal
 const goalKg = state.profile.goal==="lose"?state.profile.weight-4:state.profile.goal==="gain"?state.profile.weight+3:state.profile.weight;
 const W=350,H=120,pad=24;
 const xs=pts.map((p,i)=>i),maxX=Math.max(6,pts.length-1+4);
 const all=pts.map(p=>p.kg).concat([goalKg]);
 const minY=Math.min(...all)-1,maxY=Math.max(...all)+1;
 const X=i=>pad+(i/maxX)*(W-2*pad);
 const Y=kg=>H-pad-((kg-minY)/(maxY-minY||1))*(H-2*pad);
 let path=pts.map((p,i)=>(i?"L":"M")+X(i)+" "+Y(p.kg)).join(" ");
 const last=pts.length-1;
 let proj="M"+X(last)+" "+Y(pts[last].kg)+" L"+X(maxX)+" "+Y(goalKg);
 let dots=pts.map((p,i)=>'<circle cx="'+X(i)+'" cy="'+Y(p.kg)+'" r="3.5" fill="var(--accent)"/>').join("");
 return '<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="margin-top:8px">'
    +'<line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="var(--line)"/>'
    +'<path d="'+proj+'" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4" fill="none"/>'
    +'<path d="'+path+'" stroke="var(--accent)" stroke-width="2.5" fill="none"/>'+dots
    +'<text x="'+X(maxX)+'" y="'+(Y(goalKg)-6)+'" font-size="10" fill="var(--muted)" text-anchor="end">goal '+goalKg.toFixed(0)+'kg</text>'
    +'</svg><div class="small muted">Latest: '+pts[pts.length-1].kg.toFixed(1)+' kg · dashed line = trajectory to goal</div>';
}

/* ---------- PAYWALL ---------- */
const PAY_METHODS=[
  ["mpesa","M-Pesa","#4caf50","M"],["selcom","Selcom","#0a3d91","S"],["tigo","Tigo Pesa","#0033a0","T"],
  ["airtel","Airtel Money","#e2231a","A"],["card","Visa / Mastercard","#1a1f71","💳"],["bank","Bank transfer","#444","🏦"]
];
/* The networks a subscription can be paid with, in the order shown:
   [key, label, colour, mark, AzamPay provider name]. M-Pesa stays listed even while AzamPay
   has not switched it on for this account; the server answers with a plain message telling
   the customer to pick another network, and the day it is switched on it simply works,
   with no new release of the app. */
const SUB_NETWORKS=[
  ["tigo","Mixx by Yas","#0033a0","Y","Tigo"],
  ["airtel","Airtel Money","#e2231a","A","Airtel"],
  ["mpesa","M-Pesa","#4caf50","M","Mpesa"]
];
function subNetwork(){
 var n=SUB_NETWORKS.filter(function(x){return x[0]===state.pay.method;})[0]||SUB_NETWORKS[0];
 return {key:n[0],label:n[1],provider:n[4]};
}
function openPay(product){state.pay.open=true;state.pay.product=product;renderSheet();$("overlay").classList.add("show");}
function closePay(){state.pay.open=false;$("overlay").classList.remove("show");}
function payDef(product){
 if(product==="plan")return{prod:"plan",title:"Meal Plan",benefits:["Full personalised 7-day plan","Meal swaps & variety","Auto shopping list","Progress tracking","Plan refreshes every month"]};
 if(product==="recipes")return{prod:"recipes",title:"Plan + Recipes",benefits:["Everything in Meal Plan","Step-by-step photo recipes for every meal","Per-recipe macros"]};
 return{prod:"full",best:true,title:"Full · Premium",benefits:["Everything in Plan + Recipes","All cooking videos & classes","Priority dietitian Q&A","Fresh content every month"]};
}
function renderSheet(){
 const d=payDef(state.pay.product);
 const cyc=(state.pay.cycle==="yr")?"yr":"mo";
 const usd=price(d.prod,cyc), moP=price(d.prod,"mo"), yrP=price(d.prod,"yr"), save=Math.round((1-(yrP/(moP*12)))*100);
 let html='<div class="grab"></div>';
 html+='<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div class="b" style="font-size:18px">'+d.title+'</div>'+(d.best?'<span class="flag">BEST VALUE</span>':'')+'</div>';
 html+='<div class="seg" style="margin:8px 0"><button class="'+(cyc==="mo"?"on":"")+'" onclick="setCycle(\'mo\')">Monthly · '+fmt("USD",moP)+'</button><button class="'+(cyc==="yr"?"on":"")+'" onclick="setCycle(\'yr\')">Yearly · '+fmt("USD",yrP)+(save>0?" (save "+save+"%)":"")+'</button></div>';
 html+='<div class="price-tag"><span class="usd">'+fmt("USD",usd)+'</span><span class="alt">'+fmt("TZS",usd)+' · '+(cyc==="yr"?"per year":"per month")+'</span></div>';
 html+=d.benefits.map(b=>'<div class="benefit"><span class="ck">✓</span><span>'+b+'</span></div>').join("");
 html+='<div class="divider"></div><div class="b small" style="margin-bottom:6px">Pay with</div>';
  // Subscriptions are collected through AzamPay mobile money and nothing else. The card and
  // bank tiles used to be shown here too: picking card drew a card number and a CVC field
  // that no code ever read, and the Pay button then asked for a mobile number that was not on
  // screen. Asking a customer for their card details into a form that discards them is worse
  // than not offering the method, so the sheet now shows what genuinely works.
  // The tile the customer taps is the network that gets charged. There used to be a separate
  // "Mobile network" dropdown underneath, defaulting to M-Pesa, and that dropdown was what was
  // actually sent: a customer who tapped Mixx by Yas was still billed through M-Pesa. Tapping
  // a tile also redrew the sheet and wiped the number they had typed. Selcom was listed too,
  // though AzamPay does not collect through it.
 if(!SUB_NETWORKS.some(function(n){return n[0]===state.pay.method;})) state.pay.method=SUB_NETWORKS[0][0];
 html+='<div class="pay-grid">'+SUB_NETWORKS.map(function(m){return '<div class="pay-opt '+(state.pay.method===m[0]?"on":"")+'" onclick="setMethod(\''+m[0]+'\')"><div class="mm" style="background:'+m[2]+'">'+m[3]+'</div>'+m[1]+'</div>';}).join("")+'</div>';
 html+='<label>'+escapeHtml(subNetwork().label)+' number</label><input id="pay_phone" placeholder="07XX XXX XXX" inputmode="tel" autocomplete="tel" value="'+escapeHtml(state.pay.phone||"")+'" oninput="state.pay.phone=this.value">';
 html+='<button class="btn" id="pay_btn" style="margin-top:14px" onclick="doPay()">Pay '+fmt("USD",usd)+' · '+fmt("TZS",usd)+'</button>';
 html+='<button class="btn ghost" style="margin-top:8px" onclick="closePay()">Cancel</button>';
 html+='<div class="small muted center" style="margin-top:8px">Mobile money is one payment per period, we\'ll remind you to renew. Cancel anytime.</div>';
  $("sheet").innerHTML=html;
}

/* ---------- APP LOCK (seamless: fingerprint/Face ID + PIN) ---------- */
function securityOn(){ return !!(state.security && state.security.lock && state.security.ph); }
function setupLock(){
 var p=prompt("Choose a 4-6 digit PIN to lock the app:",""); if(p===null)return;
 if(!/^[0-9]{4,6}$/.test(p)){ toast("PIN must be 4-6 digits"); return; }
 var p2=prompt("Re-enter your PIN:",""); if(p2!==p){ toast("PINs didn't match"); return; }
 state.security={lock:true,ph:localHash(p),bio:false,bioId:""}; saveState(); render(); toast("App lock is on");
}
function disableLock(){ if(!confirm("Turn off app lock?"))return; state.security={lock:false,ph:"",bio:false,bioId:""}; saveState(); render(); toast("App lock off"); }
function showLock(){
 var el=document.getElementById("lockscreen");
 if(!el){ el=document.createElement("div"); el.id="lockscreen"; document.body.appendChild(el); }
 el.setAttribute("style","position:fixed;inset:0;z-index:10000;background:#faf2ec;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center");
 el.innerHTML='<div style="height:84px">'+logoSVG(84)+'</div><div class="b" style="font-size:18px;color:#7a2e2e">Macro Cooks is locked</div><div class="small" style="color:#9b8b84">Enter your PIN to continue</div><input id="lock_pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••" style="font-size:24px;text-align:center;letter-spacing:8px;width:170px;padding:10px;border-radius:12px;border:1px solid #e0cfc6;background:#fff" oninput="if(this.value.length>=4)tryUnlockPin()"><button class="btn" style="max-width:220px" onclick="tryUnlockPin()">Unlock</button>'+(state.security.bio?'<button class="btn ghost" style="max-width:220px" onclick="tryBiometric()">Use fingerprint / Face ID</button>':'')+'<div id="lock_msg" class="small" style="color:#c92a2a;min-height:16px"></div>';
 setTimeout(function(){ if(state.security.bio){ tryBiometric(); } else { var i=document.getElementById("lock_pin"); if(i)i.focus(); } },350);
}
function tryUnlockPin(){
 var v=((document.getElementById("lock_pin")||{}).value)||"";
 if(localHash(v)===state.security.ph){ unlockApp(); }
 else { var m=document.getElementById("lock_msg"); if(m)m.textContent="Wrong PIN, try again"; var i=document.getElementById("lock_pin"); if(i){i.value="";i.focus();} }
}
function unlockApp(){ state._unlocked=true; var el=document.getElementById("lockscreen"); if(el&&el.parentNode)el.parentNode.removeChild(el); render(); }
async function enableBiometric(){
 try{
 if(!window.PublicKeyCredential||!navigator.credentials){ toast("Not supported on this device"); return; }
 var cred=await navigator.credentials.create({publicKey:{challenge:new Uint8Array(16),rp:{name:"Macro Cooks"},user:{id:new Uint8Array(8),name:(state.cloud&&state.cloud.email)||"user",displayName:"Macro Cooks"},pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{userVerification:"required",authenticatorAttachment:"platform"},timeout:30000}});
 var id=btoa(String.fromCharCode.apply(null,new Uint8Array(cred.rawId)));
 state.security.bio=true; state.security.bioId=id; saveState(); render(); toast("Fingerprint / Face ID enabled");
  }catch(e){ toast("Fingerprint isn't available here, your PIN still works"); }
}
async function tryBiometric(){
 try{
 if(!window.PublicKeyCredential||!navigator.credentials){ return; }
 var pk={challenge:new Uint8Array(16),timeout:30000,userVerification:"required"};
 if(state.security.bioId){ var idb=Uint8Array.from(atob(state.security.bioId),function(c){return c.charCodeAt(0);}); pk.allowCredentials=[{id:idb,type:"public-key"}]; }
 await navigator.credentials.get({publicKey:pk});
 unlockApp();
  }catch(e){ var m=document.getElementById("lock_msg"); if(m)m.textContent="Use your PIN below"; }
}

const Store={KEY:"macrocooks_v1",mem:null,
 read(){try{const s=localStorage.getItem(this.KEY);return s?JSON.parse(s):this.mem;}catch(e){return this.mem;}},
 write(o){try{localStorage.setItem(this.KEY,JSON.stringify(o));this.mem=null;}catch(e){this.mem=o;try{if(!this._warned){this._warned=true;if(typeof toast==="function")toast("Storage full, recent changes may not be saved. Remove a photo");}}catch(_){}}},
 clear(){try{localStorage.removeItem(this.KEY);}catch(e){}this.mem=null;}};
function saveState(){const s=Object.assign({},state);s.pay={open:false,product:null,method:state.pay.method,cycle:"monthly"};s._canInstall=false;Store.write(s);try{pushProfileDebounced();}catch(e){}}
function loadState(){const s=Store.read();if(s){state=Object.assign(state,s);state.pay={open:false,product:null,method:(s.pay&&s.pay.method)||"mpesa",cycle:"monthly"};state._canInstall=false;}
 if(!state.profile.conditions)state.profile.conditions=[];
 if(!state.profile.country)state.profile.country="TZ";
 if(!state.photos)state.photos={before:"",after:""};
 if(!state.foodLog)state.foodLog=[];
 if(!state.cloud)state.cloud={token:"",user:null,email:"",entitlements:[]};
 if(!state.security)state.security={lock:false,ph:"",bio:false,bioId:""};
 if(cloudOn() && state.cloud && state.cloud.token==="local"){ state.cloud={token:"",user:null,email:"",entitlements:[]}; } // a local-only test account isn't valid against the cloud, start logged out
 state.unlock={plan:false,recipes:false,premium:false}; // always start locked; unlocks come from a real purchase (cloud) or this session (local/demo)
 state.adminVideos=[];state.isAdmin=false;
}

function syncOnboardInputs(){ // preserve typed values across re-renders during onboarding
 if(state.route!=="onboard")return;
 const g=id=>{const el=document.getElementById(id);return el?el.value:null;};
 const p=state.profile;
 if(g("f_name")!=null)p.name=g("f_name");
 const num=(id,min,max)=>{const v=g(id);if(v==null||v==="")return null;const n=Number(v);return (isFinite(n)&&n>=min&&n<=max)?n:null;};
 let _a=num("f_age",10,120);if(_a!=null)p.age=_a;
 if(g("f_blood"))p.blood=g("f_blood");
 let _w=num("f_weight",20,400);if(_w!=null)p.weight=_w;
 let _h=num("f_height",80,250);if(_h!=null)p.height=_h;
 let _sl=num("f_sleep",0,16);if(_sl!=null)p.sleep=_sl;
 let _wa=num("f_water",0,20);if(_wa!=null)p.water=_wa;
 if(g("f_country"))p.country=g("f_country");
}

/* ---------- DERIVED ---------- */
function dayTotals(day){return state.plan[day].meals.reduce((s,m)=>({kcal:s.kcal+m.tot.kcal,p:s.p+m.tot.p,c:s.c+m.tot.c,f:s.f+m.tot.f}),{kcal:0,p:0,c:0,f:0});}
function todayEaten(){let k=0,o={kcal:0};state.plan[0].meals.forEach((m,mi)=>{if(state.track["0-"+mi]==="eaten")o.kcal+=m.tot.kcal;});return o;}
function adherence(){let eaten=0,skip=0,total=0;Object.values(state.track).forEach(v=>{if(v==="eaten"){eaten++;total++;}else if(v==="skip"){skip++;total++;}});return{eaten,skipped:skip,total,pct:total?Math.round(eaten/total*100):0};}
function streak(){let s=0;for(let d=0;d<7;d++){const eaten=[0,1,2].every(mi=>state.track[d+"-"+mi]==="eaten");if(eaten)s++;else break;}return s;}

/* ---------- CLOUD BACKEND CONNECTION ---------- */
/* After you deploy the backend, set API_BASE to its URL, e.g.
 const API_BASE = "https://macro-cooks-backend.onrender.com";
 While API_BASE is "", the app runs in on-device (offline) mode exactly as before. */
const API_BASE = "https://macro-cooks-backend.onrender.com"; /* CLOUD MODE: real accounts + subscriptions via the backend. Set this back to "" for on-device/offline mode. */
function cloudOn(){ return !!API_BASE; }
async function apiFetch(path, opts){
 opts = opts || {};
 var headers = Object.assign({ "Content-Type":"application/json" }, opts.headers || {});
 if (state.cloud && state.cloud.token) headers["Authorization"] = "Bearer " + state.cloud.token;
 var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
 var timer = ctrl ? setTimeout(function(){ try{ctrl.abort();}catch(e){} }, 25000) : null;
 var res;
 try { res = await fetch(API_BASE + path, Object.assign({}, opts, { headers: headers, signal: ctrl ? ctrl.signal : undefined })); }
 catch(err){ if (timer) clearTimeout(timer); throw new Error("Can't reach the server, it may be waking up. Wait ~30 seconds and try again."); }
 if (timer) clearTimeout(timer);
 var data = {}; try { data = await res.json(); } catch(e){}
  // A token that has expired or been revoked answers 401 to everything. Keeping it meant the
  // app went on showing the customer as signed in while nothing loaded and their paid plan
  // quietly vanished. Clear it once and say so, so they can sign back in.
 if (res.status === 401 && state.cloud && state.cloud.token) {
 state.cloud.token=""; state.cloud.user=null; state.cloud.entitlements=[];
 state.unlock={plan:false,recipes:false,premium:false};
 state.plan=[]; state.planUnlocked=false; state.planError="Your session expired. Please sign in again.";
 try{ saveState(); }catch(e){}
 throw new Error("Your session expired, please sign in again");
  }
 if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
 return data;
}
async function cloudSignup(email, password, name){
 var d = await apiFetch("/api/auth/signup", { method:"POST", body: JSON.stringify({ email:email, password:password, name:name }) });
 state.cloud.token = d.token; state.cloud.user = d.user; state.cloud.email = email; await afterLogin();
}
async function cloudLogin(email, password){
 var d = await apiFetch("/api/auth/login", { method:"POST", body: JSON.stringify({ email:email, password:password }) });
 state.cloud.token = d.token; state.cloud.user = d.user; state.cloud.email = email; await afterLogin();
}
function cloudLogout(){ state.cloud = { token:"", user:null, email:"", entitlements:[] }; render(); toast("Signed out"); }
async function deleteAccount(){
 if(!confirm("Permanently delete your account and ALL your data (profile, plan, health info, photos) from this device and our servers? This cannot be undone.")) return;
 try{ if(cloudOn() && state.cloud && state.cloud.token){ await apiFetch("/api/auth/me",{ method:"DELETE" }); } }
 catch(e){ toast("Couldn't reach the server, please try again"); return; }
 try{ Store.clear(); }catch(e){}
 location.reload();
}
async function afterLogin(){ try { await pullProfile(); await refreshEntitlements(); } catch(e){} render(); toast("Signed in"); }
async function pullProfile(){
 var d = await apiFetch("/api/profile");
 var s = d.data || {};
 if (s && Object.keys(s).length){
    // 'plan' is deliberately not restored from the saved blob. The plan is rebuilt by the
    // server from the profile, and it hands over only the days this account is currently
    // paying for. Copying the stored copy back put a full week in front of someone whose
    // subscription had since lapsed, and it also raced the fresh copy at startup.
    ["profile","targets","track","weightLog","day","theme","currency","units","todaySupp","foodLog","onboardComplete"].forEach(function(k){ if (s[k] !== undefined) state[k] = s[k]; });
  }
}
async function pushProfile(){
 if (!cloudOn() || !state.cloud || !state.cloud.token) return;
 var _prof=Object.assign({},state.profile); delete _prof.photo; // photos stay on-device (privacy / minimization)
 var _foodLog=(state.foodLog||[]).map(function(it){var c=Object.assign({},it); delete c.photo; return c;});
 var payload = { profile:_prof, targets:state.targets, plan:state.plan, track:state.track, weightLog:state.weightLog, day:state.day, theme:state.theme, currency:state.currency, units:state.units, todaySupp:state.todaySupp, foodLog:_foodLog, onboardComplete:state.onboardComplete };
 try { await apiFetch("/api/profile", { method:"PUT", body: JSON.stringify({ data: payload }) }); } catch(e){}
}
var _pushTimer = null;
function pushProfileDebounced(){ if (!cloudOn() || !state.cloud || !state.cloud.token) return; clearTimeout(_pushTimer); _pushTimer = setTimeout(pushProfile, 2500); }
async function refreshEntitlements(){
 try {
 var d = await apiFetch("/api/payments/entitlements");
 var e = d.products || []; state.cloud.entitlements = e;
 var has=function(p){return e.indexOf(p)>=0;};
 state.unlock.plan    = has("plan")||has("recipes")||has("full");
 state.unlock.recipes = has("recipes")||has("full");
 state.unlock.premium = has("full");
  } catch(e){}
 await loadPlanFromServer();
 await loadRecipes();
 await loadClasses();
}

/* The meal plan and the recipes are built on the server and handed over only for the days
   and products this account has actually paid for. The unlock flags below are for showing
   the right buttons; they do not decide what content arrives, so changing them in a console
   does nothing. */
async function loadPlanFromServer(){
 if(!cloudOn() || !state.cloud || !state.cloud.token){
 state.plan=[]; state.planUnlocked=false;
 state.planError="Sign in to load your meal plan.";
 render(); return;
  }
 var p=state.profile||{};
 if(!p.weight||!p.height||!p.age) return;
 state.planError="";
 try{
 var d=await apiFetch("/api/content/plan",{method:"POST",body:JSON.stringify({profile:p})});
 if(d.targets) state.targets=d.targets;
 state.plan=d.days||[];
 state.planTotalDays=d.totalDays||7;
 state.planUnlocked=!!d.unlocked;
 state.planMonth=d.monthKey||currentMonthKey();
 if(state.day>=state.plan.length) state.day=0;
  }catch(e){ state.planError=(e&&e.message)||"Could not load your plan."; }
 render();
}
async function loadRecipes(){
 if(!cloudOn() || !state.cloud || !state.cloud.token){ state.recipes=[]; return; }
 try{ var d=await apiFetch("/api/content/recipes"); state.recipes=d.recipes||[]; }
 catch(e){ state.recipes=[]; }
 render();
}
function openAuth(mode){
 state._authMode = mode || "login";
 var su = state._authMode === "signup";
 var html = '<div class="grab"></div><div class="b" style="font-size:18px">' + (su ? "Create account" : "Sign in") + "</div>"
    + '<div class="small muted" style="margin-bottom:8px">' + (cloudOn() ? "Sync your plan across devices and unlock your purchases." : "Saved on this device. (Cross-device sync turns on when your cloud server is live.)") + '</div>'
    + (su ? '<label>Name</label><input id="au_name" placeholder="Your name">' : "")
    + '<label>Email</label><input id="au_email" type="email" placeholder="you@example.com">'
    + '<label>Password</label><input id="au_pass" type="password" placeholder="At least 8 characters">'
    + '<button id="au_submit" class="btn" style="margin-top:12px" onclick="submitAuth()">' + (su ? "Create account" : "Sign in") + "</button>"
    + '<div id="au_err" class="small" style="color:var(--bad);margin-top:8px"></div>'
    + '<button class="btn ghost" style="margin-top:4px" onclick="openAuth(\'' + (su ? "login" : "signup") + '\')">' + (su ? "I already have an account" : "Create a new account") + "</button>"
    + '<button class="btn ghost" style="margin-top:8px" onclick="closePay()">Cancel</button>';
 document.getElementById("sheet").innerHTML = html;
 state.pay.open = true; document.getElementById("overlay").classList.add("show");
}
async function submitAuth(){
 var email = ((document.getElementById("au_email") || {}).value || "").toLowerCase().trim();
 var pass  = (document.getElementById("au_pass")  || {}).value || "";
 var name  = (document.getElementById("au_name")  || {}).value || "";
 var errEl = document.getElementById("au_err"); var setErr=function(m){ if(errEl) errEl.textContent=m||""; };
 setErr("");
 if (!email || !pass) { setErr("Please enter your email and password."); return; }
 if (pass.length < 8) { setErr("Password must be at least 8 characters."); return; }
 if (!cloudOn()) { localAuth(email, pass, name); return; }   // on-device account, no server
 var btn = document.getElementById("au_submit"); var label = btn ? btn.textContent : "";
 if (btn){ btn.disabled = true; btn.textContent = (state._authMode === "signup" ? "Creating account…" : "Signing in…"); }
 try { if (state._authMode === "signup") await cloudSignup(email, pass, name); else await cloudLogin(email, pass); closePay(); }
 catch(e){ if (btn){ btn.disabled = false; btn.textContent = label; }
 var msg = e.message || "Something went wrong. Please try again.";
 if (/Email already registered/i.test(msg)) msg = "That email already has an account, try Sign in instead.";
 else if (/waking up|reach the server/i.test(msg)) msg = "The server is waking up, please wait ~30 seconds and try again.";
 else if (/signup failed|login failed|server error|HTTP 5/i.test(msg)) msg = "Our server couldn't reach your account database. This is a server setup issue, not your details, please try again shortly.";
 setErr(msg); toast(msg); }
}
function localHash(s){ var h=5381; for(var i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return "h"+(h>>>0); }
function localAuth(email, pass, name){
 if (state._authMode === "signup"){
 state.account = { email:email, name:name||"", ph:localHash(pass) };
 state.cloud = { token:"local", user:{ email:email, name:name||"" }, email:email, entitlements:[] };
 if (name) state.profile.name = name;
 saveState(); closePay(); render(); toast("Account created (saved on this device)");
  } else {
 var a = state.account;
 if (a && a.email===email && a.ph===localHash(pass)){
 state.cloud = { token:"local", user:{ email:a.email, name:a.name }, email:a.email, entitlements:[] };
 saveState(); closePay(); render(); toast("Signed in");
    } else if (a && a.email===email){ toast("Wrong password, try again"); }
 else { toast("No account on this device yet, tap 'Create a new account'"); }
  }
}
var _payInFlight = false;
async function cloudPay(){
  // Nothing used to stop a second tap while the first request was still in the air, and two
  // requests mean two orders and two prompts on the phone. One at a time.
 if (_payInFlight) return;
 var prod = state.pay.product;
 var phone = ((document.getElementById("pay_phone") || {}).value || "").trim();
 var network = subNetwork().provider;
 if (!phone) { toast("Enter your mobile number"); return; }
 var order;
 var cycle = (state.pay.cycle==="yr")?"yr":"mo";
 var btn = document.getElementById("pay_btn");
 var btnLabel = btn ? btn.textContent : "";
 _payInFlight = true;
 if (btn) { btn.disabled = true; btn.textContent = "Starting your payment\u2026"; }
 try { order = await apiFetch("/api/payments/checkout", { method:"POST", body: JSON.stringify({ product:prod, cycle:cycle, phone:phone, network:network }) }); }
 catch(e){ toast(e.message || "We could not start that payment"); return; }
 finally { _payInFlight = false; if (btn) { btn.disabled = false; btn.textContent = btnLabel; } }
 closePay(); toast("Approve the prompt on your phone…");
 var tries = 0;
 var iv = setInterval(async function(){
 tries++;
 try {
 var o = await apiFetch("/api/payments/orders/" + order.orderId);
 if (o.status === "paid") { clearInterval(iv); await refreshEntitlements(); render(); toast("Payment received, unlocked!"); }
 else if (o.status === "failed") { clearInterval(iv); toast("Payment failed or cancelled"); }
    } catch(e){}
 if (tries > 30) clearInterval(iv);
  }, 4000);
}

/* ---------- ROUTER ---------- */
function render(){
 renderChrome();
 const map={welcome:screenWelcome,onboard:screenOnboard,home:screenHome,plan:screenPlan,shop:screenShop,learn:screenLearn,progress:screenProgress,settings:screenSettings,community:screenCommunity,admin:screenAdmin};
 var html;
  // A screen that throws used to take the view with it: the assignment below never ran, so
  // the app sat on a blank page with the header still showing, and saveState() never ran
  // either, which meant the same thing happened again on the next launch. Catching it here
  // keeps the app usable and lets the customer move somewhere else.
 try{ html=(map[state.route]||screenHome)(); }
 catch(err){ try{ console.error("screen failed:",err); }catch(e){} html=screenBroken(); }
  $("screen").innerHTML=html;
 try{saveState();}catch(e){}
}

/* ---------- SELF-TEST (verifies the nutrition engine) ---------- */
(function selfTest(){
 const t=computeTargets({weight:80,height:180,age:30,sex:"male",activity:"moderate",goal:"maintain"});
 const okBMR = t.bmr===1780;                 // 10*80+6.25*180-5*30+5 = 1780
 const okTDEE= t.tdee===Math.round(1780*1.55);
 const okMacro = (t.protein*4 + t.carbs*4 + t.fat*9) <= t.cal+30; // macros fit calorie budget
 const badge=$("selftest");
 if(okBMR&&okTDEE&&okMacro){badge.textContent="self-test ✓";badge.style.background="#2f9e44";badge.style.color="#fff";}
 else{badge.textContent="self-test ✗";badge.style.background="#c92a2a";badge.style.color="#fff";}
})();

(function route(){

if(cloudOn() && state.cloud && state.cloud.token){ try{ refreshEntitlements(); pullProfile().then(function(){ render(); }); }catch(e){} }
